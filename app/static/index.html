<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI Screenshot Repository</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff; --surface: #f5f5f4; --text: #1c1917; --muted: #57534e;
      --border: #e7e5e4; --border-strong: #78716c; --accent: #2563eb; --on-accent: #ffffff;
      --danger: #b91c1c; --warning: #b45309;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0a09; --surface: #1c1917; --text: #f5f5f4; --muted: #a8a29e;
        --border: #292524; --border-strong: #78716c; --accent: #60a5fa; --on-accent: #0c0a09;
        --danger: #f87171; --warning: #fbbf24;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main, header, .note, .search, .messages { max-width: 1200px; margin-inline: auto; padding-inline: 16px; }
    header { display: flex; align-items: center; gap: 16px; padding-block: 16px; border-bottom: 1px solid var(--border); max-width: none; }
    header > * { max-width: none; }
    .bar { max-width: 1200px; width: 100%; margin-inline: auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    h1 { font-size: 18px; margin: 0; margin-right: auto; }
    .note { color: var(--muted); margin-block: 12px 8px; }
    .search { display: block; width: 100%; }
    input[type="search"] { width: 100%; padding: 10px 14px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; }
    input::placeholder { color: var(--muted); }
    .messages { min-height: 1.5em; margin-block: 8px; }
    #status { margin: 0; color: var(--muted); }
    #alert { margin: 0; color: var(--text); border-left: 4px solid var(--danger); padding-left: 10px; }
    #alert:empty { display: none; }
    button { font: inherit; color: var(--text); cursor: pointer; }
    .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 10px; padding: 8px 14px; }
    .secondary { background: transparent; border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 14px; }
    .danger { background: transparent; border: 0; color: var(--danger); padding: 8px 14px; }
    button:disabled { opacity: .5; cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .check { display: flex; align-items: center; gap: 6px; color: var(--text); }
    #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; padding-block: 8px 96px; }
    .card { display: block; text-align: left; background: none; border: 0; padding: 0; min-width: 0; }
    .thumb { aspect-ratio: 3 / 4; background: var(--surface); border-radius: 10px; overflow: hidden; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
    .pending .thumb, .failed .thumb { opacity: .5; }
    .card .title { margin-top: 6px; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card .line { font-size: 13px; color: var(--muted); min-height: 1.45em; }
    .card .line.bad { color: var(--danger); }
    .badge { display: inline-block; font-size: 12px; color: var(--warning); border: 1px solid var(--warning); border-radius: 999px; padding: 0 8px; margin-top: 2px; }
    .empty { border: 2px dashed var(--border-strong); border-radius: 10px; padding: 48px 16px; text-align: center; color: var(--muted); margin-block: 16px; }
    .empty p { margin: 4px 0; }
    .linkbtn { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
    dialog { width: min(920px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 16px; color: var(--text); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; }
    dialog::backdrop { background: rgb(0 0 0 / .5); }
    .detail { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; }
    @media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
    .detail img { width: 100%; max-height: 80vh; object-fit: contain; border-radius: 10px; background: var(--surface); }
    .detail h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
    .muted { color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .tag { background: var(--surface); border: 0; border-radius: 999px; padding: 2px 12px; }
    .box { border: 1px solid var(--warning); border-radius: 10px; padding: 8px 12px; margin-block: 12px; }
    .box.err { border-color: var(--danger); }
    details pre { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); padding: 8px; border-radius: 10px; max-height: 240px; overflow: auto; }
    .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .actions .spacer { margin-left: auto; }
    @media (max-width: 600px) { #grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); padding-bottom: 120px; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>AI Screenshot Repository</h1>
      <label class="check"><input type="checkbox" id="flagged"> Show flagged</label>
      <button class="primary" id="add" type="button">Add screenshots</button>
      <input type="file" id="files" multiple accept="image/png,image/jpeg,image/webp" hidden>
    </div>
  </header>
  <p class="note">Screenshots are sent to Google Gemini (free tier) for tagging. Don't upload anything private.</p>
  <div class="search"><input type="search" id="q" placeholder="Search screenshots..." aria-label="Search screenshots"></div>
  <div class="messages">
    <p id="status" role="status"></p>
    <p id="alert" role="alert"></p>
  </div>
  <main><div id="grid"></div><div id="empty"></div></main>

  <dialog id="detail" aria-label="Screenshot details"></dialog>

<script>
"use strict";
// Everything from the server (titles, tags, extracted text, messages) and every file name
// goes in with textContent or DOM properties, never innerHTML: text read out of a
// screenshot is untrusted.
const MAX_FILES = 20;
const $ = (id) => document.getElementById(id);
const grid = $("grid"), empty = $("empty"), detail = $("detail");
let timer = null, searchTimer = null, pendingIds = new Set(), openId = null, openStatus = null;
let loadSeq = 0, lastGrid = "", lastDetail = "", loadFailed = false;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let message = "Request failed";
    try { message = (await response.json()).detail || message; } catch (e) { /* no body */ }
    throw Object.assign(new Error(message), { status: response.status });
  }
  return response.status === 204 ? null : response.json();
}

const fileUrl = (id) => "/api/images/" + encodeURIComponent(id) + "/file";
const placeText = (row) => [row.city, row.country].filter(Boolean).join(", ");

function say(text, isError = false) {
  $("status").textContent = isError ? "" : text;
  $("alert").textContent = isError ? "Error: " + text : "";
}

// --- the library -------------------------------------------------------------

function listUrl() {
  const params = new URLSearchParams({ q: $("q").value, show_flagged: $("flagged").checked });
  return "/api/images?" + params;
}

function card(row) {
  const kids = [el("div", { className: "thumb" }, el("img", { src: fileUrl(row.id), alt: "", loading: "lazy" }))];
  if (row.status === "pending") {
    kids.push(el("div", { className: "title" }), el("div", { className: "line", textContent: "Tagging..." }));
  } else if (row.status === "failed") {
    kids.push(el("div", { className: "line bad", textContent: "Tagging failed" }),
              el("div", { className: "line", textContent: row.error || "" }));
  } else {
    kids.push(el("div", { className: "title", textContent: row.title || "Untitled screenshot" }),
              el("div", { className: "line", textContent: placeText(row) }));
    if (row.contains_personal_info) kids.push(el("span", { className: "badge", textContent: "Flagged" }));
  }
  const button = el("button", { className: "card " + row.status, type: "button" }, ...kids);
  button.addEventListener("click", () => openDetail(row.id));
  return button;
}

function render(rows) {
  grid.replaceChildren(...rows.map(card));
  empty.replaceChildren();
  if (rows.length) return;
  const typed = $("q").value.trim();
  if (typed || $("flagged").checked) {
    const clear = el("button", { className: "linkbtn", type: "button", textContent: "Clear all" });
    clear.addEventListener("click", () => { $("q").value = ""; $("flagged").checked = false; load(true); });
    empty.append(el("div", { className: "empty" },
      el("p", { textContent: typed ? `No screenshots match "${typed}".` : "No screenshots match these filters." }), clear));
  } else {
    empty.append(el("div", { className: "empty" },
      el("p", { textContent: "Drop screenshots here, or use Add screenshots above." }),
      el("p", { textContent: "PNG, JPEG or WebP, up to 10 MB each, 20 at a time." })));
  }
}

// What happened to cards we were waiting on: report failures, and images that
// turned out to contain personal info and so left the view (AC-8).
async function reportChanges(rows) {
  const now = new Set(rows.filter((r) => r.status === "pending").map((r) => r.id));
  let failed = 0, hidden = 0;
  for (const id of pendingIds) {
    if (now.has(id)) continue;
    const row = rows.find((r) => r.id === id);
    if (row) { if (row.status === "failed") failed++; continue; }
    try {
      const gone = await api("/api/images/" + encodeURIComponent(id));
      if (gone.contains_personal_info) hidden++;
    } catch (e) { /* deleted meanwhile */ }
  }
  pendingIds = now;
  if (failed) say(`Tagging failed for ${failed} screenshot${failed > 1 ? "s" : ""}.`, true);
  else if (hidden) say(`${hidden} screenshot${hidden > 1 ? "s" : ""} hidden: may contain personal info. Turn on Show flagged to see them.`);
}

async function load(announce = false) {
  clearTimeout(timer);
  const seq = ++loadSeq; // only the newest request may change the page
  let rows;
  try {
    rows = await api(listUrl());
  } catch (e) {
    if (seq === loadSeq) {
      say("Could not load the library. Is the app running?", true);
      loadFailed = true;
      timer = setTimeout(load, 5000);
    }
    return;
  }
  if (seq !== loadSeq) return; // a newer search has started: this answer is stale
  if (loadFailed) { $("alert").textContent = ""; loadFailed = false; } // the library is reachable again
  const signature = JSON.stringify(rows);
  if (signature !== lastGrid) { render(rows); lastGrid = signature; } // keeps focus and thumbnails while polling
  await reportChanges(rows);
  if (announce) say(`Showing ${rows.length} screenshot${rows.length === 1 ? "" : "s"}.`);
  if (rows.some((r) => r.status === "pending") || (detail.open && openStatus === "pending")) {
    timer = setTimeout(load, 2000);
  }
  if (detail.open && openStatus === "pending") showDetail(openId);
}

// --- uploading ---------------------------------------------------------------

async function upload(files) {
  if (!files.length) return;
  if (files.length > MAX_FILES) { say(`You can add up to ${MAX_FILES} screenshots at a time.`, true); return; }
  const form = new FormData();
  files.forEach((f) => form.append("files", f));
  say(`Uploading ${files.length} screenshot${files.length > 1 ? "s" : ""}...`);
  let results;
  try {
    results = await api("/api/images", { method: "POST", body: form });
  } catch (e) {
    say(e.status ? e.message : "Upload failed. Check the app is running and try again.", true);
    return;
  }
  const added = results.filter((r) => r.id !== null && !r.duplicate).length;
  const dupes = results.filter((r) => r.duplicate).length;
  const rejected = results.map((r, i) => (r.error ? `${files[i].name} (${r.error})` : null)).filter(Boolean);
  const parts = [];
  if (added) parts.push(`Added ${added} screenshot${added > 1 ? "s" : ""}.`);
  if (dupes) parts.push(`${dupes} already in your library.`);
  if (rejected.length) parts.push(`Not added: ${rejected.join(", ")}.`);
  say(parts.join(" "), rejected.length > 0);
  $("q").value = ""; // so the new cards are visible
  pendingIds = new Set(results.filter((r) => r.status === "pending").map((r) => r.id));
  await load();
}

$("add").addEventListener("click", () => $("files").click());
$("files").addEventListener("change", (e) => { upload([...e.target.files]); e.target.value = ""; });
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => { e.preventDefault(); upload([...e.dataTransfer.files]); });
$("q").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => load(true), 250); });
$("flagged").addEventListener("change", () => load(true));

// --- one screenshot ------------------------------------------------------------

async function openDetail(id) {
  openId = id;
  lastDetail = "";
  await showDetail(id);
  if (!detail.open) detail.showModal();
}

async function showDetail(id) {
  let row;
  try {
    row = await api("/api/images/" + encodeURIComponent(id));
  } catch (e) {
    detail.replaceChildren(el("p", { textContent: "This screenshot isn't in your library." }), closeButton());
    openStatus = null;
    return;
  }
  openStatus = row.status;
  const signature = JSON.stringify(row);
  if (signature === lastDetail && detail.open) return; // unchanged: don't rebuild the open dialog
  lastDetail = signature;
  const title = row.status === "pending" ? "Tagging..." : row.title || "Untitled screenshot";
  const info = [placeText(row), row.category].filter(Boolean).join(" · ");
  const side = [el("h2", { textContent: title }), el("div", { className: "muted", textContent: info })];
  if (row.status === "failed") {
    side.push(el("div", { className: "box err" }, el("div", { textContent: row.error || "Tagging error" }),
      el("div", { className: "muted", textContent: "Use Retry tagging to try again." })));
  }
  if (row.contains_personal_info) side.push(el("div", { className: "box", textContent: "Flagged: may contain personal info." }));
  if (row.summary) side.push(el("p", { textContent: row.summary }));
  if (row.tags.length) {
    side.push(el("div", { className: "tags" }, ...row.tags.map((tag) => {
      const b = el("button", { className: "tag", type: "button", textContent: tag });
      b.addEventListener("click", () => { detail.close(); $("q").value = tag; load(true); });
      return b;
    })));
  }
  if (row.extracted_text) {
    side.push(el("details", {}, el("summary", { textContent: "Text in image" }), el("pre", { textContent: row.extracted_text })));
  }
  if (row.status === "tagged") {
    const added = new Date(row.created_at).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
    side.push(el("p", { className: "muted", textContent: `Added ${added} · ${row.model} · prompt ${row.prompt_version}` }));
  }
  const retry = el("button", { className: "secondary", type: "button", textContent: "Retry tagging", disabled: row.status === "pending" });
  retry.addEventListener("click", () => act(() => api(`/api/images/${encodeURIComponent(id)}/retag`, { method: "POST" })));
  const remove = el("button", { className: "danger", type: "button", textContent: "Delete" });
  remove.addEventListener("click", async () => {
    if (!confirm("Delete this screenshot? This can't be undone.")) return;
    await act(() => api(`/api/images/${encodeURIComponent(id)}`, { method: "DELETE" }), true);
  });
  side.push(el("div", { className: "actions" }, retry, remove, Object.assign(closeButton(), { className: "secondary spacer" })));
  const picture = el("img", { src: fileUrl(id), alt: row.status === "tagged" ? (row.title || "Screenshot") : "Screenshot, " + (row.status === "pending" ? "tagging in progress" : "tagging failed") });
  detail.replaceChildren(el("div", { className: "detail" }, picture, el("div", {}, ...side)));
}

function closeButton() {
  const b = el("button", { type: "button", textContent: "Close" });
  b.addEventListener("click", () => detail.close());
  return b;
}

async function act(request, closeAfter = false) {
  try { await request(); } catch (e) { say(e.message, true); return; }
  if (closeAfter) detail.close(); else await showDetail(openId);
  await load();
}

detail.addEventListener("click", (e) => { if (e.target === detail) detail.close(); });
detail.addEventListener("close", () => { openId = null; openStatus = null; lastDetail = ""; });

load();
</script>
</body>
</html>
